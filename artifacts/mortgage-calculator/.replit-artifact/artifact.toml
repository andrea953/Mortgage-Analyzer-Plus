kind = "web"
previewPath = "/"
title = "Mortgage Calculator"
version = "1.0.0"
id = "artifacts/mortgage-calculator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18481

[services.development]
run = "pnpm --filter @workspace/mortgage-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mortgage-calculator", "run", "build" ]
publicDir = "artifacts/mortgage-calculator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18481"
BASE_PATH = "/"
